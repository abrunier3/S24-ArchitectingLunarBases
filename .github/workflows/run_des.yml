name: Step 4 — Run DES Simulation
run-name: DES — ${{ github.event.inputs.scenario_slug || 'ECLIPSE_Project' }} — ${{ github.event.inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique UI request identifier used to correlate results'
        required: false
        default: 'manual'
      scenario_name:
        description: 'Scenario display identifier'
        required: false
        default: 'ECLIPSE_Project'
      scenario_slug:
        description: 'Repository-safe scenario identifier'
        required: false
        default: 'ECLIPSE_Project'
      sysml_file:
        description: 'Scenario SysML path in the repository'
        required: false
        default: 'clean_database/sysml/ECLIPSE_Project.sysml'
      active_nodes:
        description: 'JSON array of DES active nodes'
        required: true
        default: '[]'
      slider_values:
        description: 'JSON object of DES slider values'
        required: false
        default: '{}'
      scenario_config:
        description: 'JSON object of DES scenario assumptions'
        required: false
        default: '{}'
      Num_Regolith_Rovers:
        description: 'Number of regolith rovers'
        required: true
        default: '1'
      Num_LOX_Rovers:
        description: 'Number of LOX rovers'
        required: false
        default: '1'
      Num_ISRU_Plants:
        description: 'Number of ISRU plants'
        required: true
        default: '1'
      Regolith_Haul_Distance:
        description: 'Regolith haul distance (km)'
        required: true
        default: '1'
      LOX_Haul_Distance:
        description: 'LOX haul distance (km)'
        required: true
        default: '1'
      Rover_Energy_Consumption:
        description: 'Rover energy consumption (kWh/km/kg)'
        required: true
        default: '0.00034'
      Rover_Travel_Time:
        description: 'Rover travel time (hr/km)'
        required: true
        default: '5'
      ISRU_Plant_Processing_Rate:
        description: 'ISRU plant processing rate (kg/hr)'
        required: true
        default: '1600'
      LOX_Transport_Threshold:
        description: 'LOX transport threshold (kg)'
        required: true
        default: '100'
      urban_planning:
        description: 'JSON object with site, module positions/orientations and route waypoints'
        required: false
        default: '{}'
      cad_axis_overrides:
        description: 'Optional JSON object with per-module CAD source up/front axes'
        required: false
        default: '{}'

jobs:
  run-des:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install simpy
          pip install usd-core
          pip install -e .

      - name: Run DES simulation
        env:
          SCENARIO_NAME:              ${{ github.event.inputs.scenario_name || 'ECLIPSE_Project' }}
          SCENARIO_SLUG:              ${{ github.event.inputs.scenario_slug || 'ECLIPSE_Project' }}
          DES_REQUEST_ID:             ${{ github.event.inputs.request_id || 'manual' }}
          SYSML_FILE:                 ${{ github.event.inputs.sysml_file || 'clean_database/sysml/ECLIPSE_Project.sysml' }}
          ACTIVE_NODES:               ${{ github.event.inputs.active_nodes }}
          SLIDER_VALUES_JSON:         ${{ github.event.inputs.slider_values }}
          SCENARIO_CONFIG_JSON:       ${{ github.event.inputs.scenario_config }}
          NUM_REGOLITH_ROVERS:        ${{ github.event.inputs.Num_Regolith_Rovers }}
          NUM_LOX_ROVERS:             ${{ github.event.inputs.Num_LOX_Rovers }}
          NUM_ISRU_PLANTS:            ${{ github.event.inputs.Num_ISRU_Plants }}
          REGOLITH_HAUL_DISTANCE:     ${{ github.event.inputs.Regolith_Haul_Distance }}
          LOX_HAUL_DISTANCE:          ${{ github.event.inputs.LOX_Haul_Distance }}
          ROVER_ENERGY_CONSUMPTION:   ${{ github.event.inputs.Rover_Energy_Consumption }}
          ROVER_TRAVEL_TIME:          ${{ github.event.inputs.Rover_Travel_Time }}
          ISRU_PLANT_PROCESSING_RATE: ${{ github.event.inputs.ISRU_Plant_Processing_Rate }}
          LOX_TRANSPORT_THRESHOLD:    ${{ github.event.inputs.LOX_Transport_Threshold }}
          URBAN_PLANNING_JSON:        ${{ github.event.inputs.urban_planning }}
          CAD_AXIS_OVERRIDES_JSON:    ${{ github.event.inputs.cad_axis_overrides }}
        run: |
          mkdir -p outputs
          python - <<'EOF'
          import json, os, time, sys
          from pathlib import Path
          sys.path.insert(0, '.')

          scenario_name = os.environ.get("SCENARIO_NAME", "ECLIPSE_Project").strip()
          scenario_slug = os.environ.get("SCENARIO_SLUG", scenario_name).strip()
          request_id = os.environ.get("DES_REQUEST_ID", "manual").strip() or "manual"
          sysml_file = Path(os.environ.get(
              "SYSML_FILE", "clean_database/sysml/ECLIPSE_Project.sysml"
          ).strip())
          if not scenario_slug or any(ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_" for ch in scenario_slug):
              raise ValueError(f"Invalid scenario identifier: {scenario_slug!r}")
          expected_sysml = Path("clean_database/sysml") / f"{scenario_slug}.sysml"
          if sysml_file != expected_sysml:
              raise ValueError(
                  f"SysML/config naming mismatch: expected {expected_sysml}, got {sysml_file}"
              )
          scenario_json_dir = Path("clean_database/json") / scenario_slug
          scenario_assets_dir = scenario_json_dir / "assets"
          scenario_json_path = scenario_json_dir / f"{scenario_slug}.json"
          scenario_output_dir = Path("outputs/scenarios") / scenario_slug
          scenario_output_dir.mkdir(parents=True, exist_ok=True)

          sysml_active_nodes = json.loads(os.environ['ACTIVE_NODES'])
          if not sysml_active_nodes:
              try:
                  with (scenario_output_dir / "graph.json").open() as f:
                      graph_data = json.load(f)
                  sysml_active_nodes = graph_data.get("active_nodes") or []
                  print(f"[DES] Loaded {len(sysml_active_nodes)} active node(s) from {scenario_output_dir / 'graph.json'}.")
              except FileNotFoundError:
                  print(f"[DES] No active_nodes input and no graph found for {scenario_slug}.")

          def normalize_name(value):
              return "".join(ch for ch in str(value or "").lower() if ch.isalnum())

          def load_sysml_part(node_name):
              asset_dirs = [scenario_assets_dir]
              asset_dirs.extend(
                  path for path in Path("clean_database/json").glob("*/assets")
                  if path != scenario_assets_dir
              )
              for assets_dir in asset_dirs:
                  asset_path = assets_dir / f"{node_name}.json"
                  if asset_path.exists():
                      with asset_path.open() as f:
                          return json.load(f)
              return {}

          def infer_des_engine_nodes(sysml_nodes):
              engine_nodes = set()

              for node in sysml_nodes:
                  part = load_sysml_part(node)
                  attrs = list((part.get("attributes") or {}).keys())
                  ports = []
                  for port in part.get("ports") or []:
                      ports.extend([
                          port.get("name"),
                          *(port.get("items") or []),
                          *(port.get("direction") or []),
                      ])

                  text = normalize_name(" ".join([node, *attrs, *filter(None, ports)]))

                  if "isru" in text and ("processingrate" in text or "loxstored" in text or "regolithportin" in text):
                      engine_nodes.add("ISRUPlant")
                  if "regolith" in text and "rover" in text:
                      engine_nodes.add("RegolithRover")
                  if "lox" in text and "rover" in text:
                      engine_nodes.add("LOXRover")
                  if (
                      "poweroutput" in text
                      or "totalenergygenerated" in text
                      or "powerportout" in text
                      or "powerout" in text
                      or "solarpower" in text
                  ):
                      engine_nodes.add("SolarPowerSystem")
                  if "habitation" in text or "habitat" in text:
                      engine_nodes.add("HabitationModule")
                  if "communication" in text or "comm" in text:
                      engine_nodes.add("CommunicationModule")
                  if "launch" in text or "landing" in text or "depot" in text or "loxcapacity" in text:
                      engine_nodes.add("LaunchLandingZone")

              return sorted(engine_nodes)

          scenario_config_raw = os.environ.get("SCENARIO_CONFIG_JSON", "{}").strip() or "{}"
          try:
              scenario_config_payload = json.loads(scenario_config_raw)
          except json.JSONDecodeError as exc:
              raise ValueError(f"Invalid scenario_config JSON: {exc}") from exc
          engine_mode = str(
              (scenario_config_payload.get("engine") or {}).get("mode", "isru")
          ).strip().lower()

          active_nodes = (
              list(sysml_active_nodes)
              if engine_mode == "generic"
              else infer_des_engine_nodes(sysml_active_nodes)
          )
          print(f"[DES] SysML active nodes: {sysml_active_nodes}")
          print(f"[DES] Engine mode: {engine_mode}")
          print(f"[DES] DES engine active nodes: {active_nodes}")

          slider_values = json.loads(os.environ.get("SLIDER_VALUES_JSON") or "{}")
          if not isinstance(slider_values, dict):
              slider_values = {}

          def slider_number(name, env_name, cast=float):
              raw_value = slider_values.get(name, os.environ[env_name])
              return cast(raw_value)

          slider_value_dict = {
              "active_nodes":               active_nodes,
              "sysml_active_nodes":         sysml_active_nodes,
              "sysml_json_path":            str(scenario_json_path),
              "Num_Regolith_Rovers":        slider_number("Num_Regolith_Rovers", "NUM_REGOLITH_ROVERS", int),
              "Num_LOX_Rovers":             slider_number("Num_LOX_Rovers", "NUM_LOX_ROVERS", int),
              "Num_ISRU_Plants":            slider_number("Num_ISRU_Plants", "NUM_ISRU_PLANTS", int),
              "Regolith_Haul_Distance":     slider_number("Regolith_Haul_Distance", "REGOLITH_HAUL_DISTANCE"),
              "LOX_Haul_Distance":          slider_number("LOX_Haul_Distance", "LOX_HAUL_DISTANCE"),
              "Rover_Energy_Consumption":   slider_number("Rover_Energy_Consumption", "ROVER_ENERGY_CONSUMPTION"),
              "Rover_Travel_Time":          slider_number("Rover_Travel_Time", "ROVER_TRAVEL_TIME"),
              "ISRU_Plant_Processing_Rate": slider_number("ISRU_Plant_Processing_Rate", "ISRU_PLANT_PROCESSING_RATE"),
              "LOX_Transport_Threshold":    slider_number("LOX_Transport_Threshold", "LOX_TRANSPORT_THRESHOLD"),
          }
          if scenario_config_raw != "{}":
              slider_value_dict["scenario_config"] = scenario_config_raw
          slider_value_dict.update({
              key: value for key, value in slider_values.items()
              if key not in slider_value_dict
          })

          def normalize_des_asset_attributes():
              asset_dirs = [scenario_assets_dir] if scenario_assets_dir.exists() else []
              if not asset_dirs:
                  print("[DES] Asset normalization skipped: no clean_database/json/*/assets directory found.")
                  return

              normalized = 0
              for assets_dir in asset_dirs:
                  plant_path = assets_dir / "ISRUPlant.json"
                  excavation_path = assets_dir / "ISRUExcavation.json"

                  if not plant_path.exists() or not excavation_path.exists():
                      continue

                  with plant_path.open() as f:
                      plant = json.load(f)
                  with excavation_path.open() as f:
                      excavation = json.load(f)

                  plant_attrs = plant.setdefault("attributes", {})
                  excavation_attrs = excavation.get("attributes", {})

                  if "excavationEnergyCoeff" not in plant_attrs and "excavationEnergyCoeff" in excavation_attrs:
                      plant_attrs["excavationEnergyCoeff"] = excavation_attrs["excavationEnergyCoeff"]
                      with plant_path.open("w") as f:
                          json.dump(plant, f, indent=2)
                      normalized += 1

              if normalized:
                  print(f"[DES] Copied excavationEnergyCoeff into {normalized} ISRUPlant asset(s) for DES compatibility.")
              else:
                  print("[DES] No ISRUPlant asset required excavationEnergyCoeff normalization.")

          normalize_des_asset_attributes()

          # ── Update SysML JSON with urban planning data ─────────────────────
          def update_sysml_with_urban_planning(urban_planning):
              sysml_path = scenario_json_path
              if not sysml_path.exists():
                  print(f"[UP] {sysml_path} not found — skipping SysML update.")
                  return

              with sysml_path.open() as f:
                  sysml = json.load(f)

              modules   = urban_planning.get("modules", {})
              conns     = urban_planning.get("connections", {})
              site_id   = urban_planning.get("site", "unknown")
              site_name = urban_planning.get("site_name", site_id)

              updated_parts = 0
              for part in sysml.get("parts", []):
                  name = part.get("name")
                  if name in modules:
                      m = modules[name]
                      part.setdefault("transform", {})
                      part["transform"]["position_m"]  = m["position_m"]
                      part["transform"]["rotation_deg"] = m["rotation_deg"]
                      updated_parts += 1

              # Build MST graph from frontend edges for path reconstruction
              mst_edges = urban_planning.get("mst_edges", [])

              # Adjacency: module → list of {neighbor, key, reverse}
              adjacency = {}
              for edge in mst_edges:
                  a, b, key = edge["from"], edge["to"], edge["key"]
                  adjacency.setdefault(a, []).append({"neighbor": b, "key": key, "reverse": False})
                  adjacency.setdefault(b, []).append({"neighbor": a, "key": key, "reverse": True})

              def find_mst_path(start, end):
                  """BFS on MST graph — returns ordered list of (key, reverse) tuples."""
                  if start == end:
                      return []
                  visited = {start}
                  queue = [(start, [])]
                  while queue:
                      node, path = queue.pop(0)
                      for edge in adjacency.get(node, []):
                          nb = edge["neighbor"]
                          if nb not in visited:
                              new_path = path + [(edge["key"], edge["reverse"])]
                              if nb == end:
                                  return new_path
                              visited.add(nb)
                              queue.append((nb, new_path))
                  return None  # no path found

              def concat_path(start, end):
                  """Concatenate waypoints along MST path from start to end."""
                  path_keys = find_mst_path(start, end)
                  if path_keys is None:
                      return None
                  all_waypoints = []
                  total_dist = 0.0
                  for key, reverse in path_keys:
                      seg = conns.get(key)
                      if not seg:
                          continue
                      wpts = seg["waypoints_m"]
                      if reverse:
                          wpts = list(reversed(wpts))
                      if all_waypoints and wpts:
                          all_waypoints.extend(wpts[1:])
                      else:
                          all_waypoints.extend(wpts)
                      total_dist += seg["distance_km"]
                  if not all_waypoints:
                      return None
                  return {"waypoints_m": all_waypoints, "distance_km": round(total_dist, 3)}

              # Build the two physical routes:
              # 1. Regolith: ISRUExcavation → ISRUPlant
              # 2. LOX: ISRUPlant → PropellantDepot → LaunchLandingZone
              regolith_path = concat_path("ISRUExcavation", "ISRUPlant")

              lox_leg1 = concat_path("ISRUPlant", "PropellantDepot")
              lox_leg2 = concat_path("PropellantDepot", "LaunchLandingZone")
              if lox_leg1 and lox_leg2:
                  lox_waypoints = lox_leg1["waypoints_m"] + lox_leg2["waypoints_m"][1:]
                  lox_path = {"waypoints_m": lox_waypoints, "distance_km": round(lox_leg1["distance_km"] + lox_leg2["distance_km"], 3)}
              else:
                  lox_path = lox_leg1 or lox_leg2 or None

              print(f"[UP] Regolith path: {len(regolith_path['waypoints_m']) if regolith_path else 0} pts, {regolith_path['distance_km'] if regolith_path else 0} km")
              print(f"[UP] LOX path: {len(lox_path['waypoints_m']) if lox_path else 0} pts, {lox_path['distance_km'] if lox_path else 0} km")

              # Rename connections and assign paths
              # ISRUPlantToLaunchLandingZone gets the full LOX path (Plant→Depot→LZ)
              # ISRUPlantToPropellantDepot gets only the first leg (Plant→Depot)
              CONN_RENAME = {
                  "ISRUExcavationToRegolithRover": "ISRUExcavationToISRUPlant",
                  "RegolithRoverToISRUPlant":       "ISRUExcavationToISRUPlant",
                  "ISRUPlantToRover":               "ISRUPlantToLaunchLandingZone",
                  "RoverToPropellantDepot":         "ISRUPlantToPropellantDepot",
              }

              LOX_PATHS = {
                  "ISRUPlantToLaunchLandingZone": lox_leg1,
                  "ISRUPlantToPropellantDepot":   lox_path,
              }

              updated_conns = 0
              seen_names = set()
              for conn in sysml.get("connections", []):
                  original_name = conn.get("name", "")
                  flow = conn.get("flow", "")
                  new_name = CONN_RENAME.get(original_name, original_name)
                  conn["name"] = new_name

                  if flow == "Power":
                      conn.pop("path", None)
                      continue

                  if new_name in seen_names:
                      conn.pop("path", None)
                      continue

                  if flow == "Regolith" and regolith_path:
                      conn["path"] = regolith_path
                      seen_names.add(new_name)
                      updated_conns += 1
                  elif flow == "LOX" and new_name in LOX_PATHS and LOX_PATHS[new_name]:
                      conn["path"] = LOX_PATHS[new_name]
                      seen_names.add(new_name)
                      updated_conns += 1
                  else:
                      conn.pop("path", None)

              # Remove duplicate connection names — keep only first occurrence
              seen_dedup = set()
              sysml["connections"] = [
                  c for c in sysml["connections"]
                  if c["name"] not in seen_dedup and not seen_dedup.add(c["name"])
              ]

              # Add every instance-level operational rover route selected in
              # Step 4.2. These named paths are consumed by both the manifest
              # builder and the Omniverse extension, so visualization follows
              # the same assigned rover, stops, and distance as the DES.
              scenario_logic = urban_planning.get("scenario_logic", {})
              existing_connection_names = {
                  connection.get("name") for connection in sysml["connections"]
              }
              for route in scenario_logic.get("resource_routes", []):
                  flow = route.get("flow")
                  source = route.get("from")
                  destination = route.get("to")
                  route_name = route.get("route_name") or f"{source}To{destination}_{flow}"
                  geometry = conns.get(route_name)
                  if not geometry:
                      print(f"[UP] Operational route geometry missing: {route_name}")
                      continue

                  operational_connection = {
                      "name": route_name,
                      "type": "OperationalRoute",
                      "flow": flow,
                      "from": {"part": source},
                      "to": {"part": destination},
                      "rover_id": route.get("rover_id"),
                      "stops": route.get("stops", []),
                      "path": {
                          "waypoints_m": geometry.get("waypoints_m", []),
                          "distance_km": geometry.get(
                              "distance_km", route.get("distance_km", 0.0)
                          ),
                      },
                  }
                  if route_name in existing_connection_names:
                      sysml["connections"] = [
                          connection for connection in sysml["connections"]
                          if connection.get("name") != route_name
                      ]
                  sysml["connections"].append(operational_connection)
                  existing_connection_names.add(route_name)

              # Store urban planning metadata at root level
              sysml["urban_planning"] = {
                  "site":      site_id,
                  "site_name": site_name,
                  "site_lat":  urban_planning.get("site_lat"),
                  "site_lon":  urban_planning.get("site_lon"),
              }
              if urban_planning.get("map_frame_m"):
                  sysml["urban_planning"]["map_frame_m"] = urban_planning["map_frame_m"]
              sysml["urban_planning"]["module_instances"] = modules
              sysml["urban_planning"]["routes"] = mst_edges
              sysml["urban_planning"]["route_geometry"] = conns

              # Preserve the instance-level operational architecture selected
              # in Step 4.2. The DES consumes the same payload directly, while
              # the authoritative JSON keeps an auditable copy of destinations,
              # stops, interfaces, rover counts, and user equations.
              sysml["scenario_logic"] = scenario_logic

              with sysml_path.open("w") as f:
                  json.dump(sysml, f, indent=2)

              print(f"[UP] SysML updated — {updated_parts} part(s), {updated_conns} connection(s) | site: {site_name}")

          urban_planning_raw = os.environ.get("URBAN_PLANNING_JSON", "{}").strip()
          if urban_planning_raw and urban_planning_raw != "{}":
              try:
                  urban_planning = json.loads(urban_planning_raw)
                  if urban_planning.get("modules"):
                      update_sysml_with_urban_planning(urban_planning)
                  else:
                      print("[UP] urban_planning payload present but no modules — skipping SysML update.")
              except json.JSONDecodeError as e:
                  print(f"[UP] Failed to parse urban_planning JSON: {e}")
          else:
              print("[UP] No urban_planning data — skipping SysML update.")

          # ── Run DES ────────────────────────────────────────────────────────
          from S24.DES_pipeline_version.scenario_runner import run_scenario, check_scenario_validity

          print("[DES] Checking scenario validity...")
          messages = check_scenario_validity(slider_value_dict, raiseError=False)
          errors   = [m for m in messages if m.startswith('[ERROR]')]
          warnings = [m for m in messages if m.startswith('[WARNING]') or m.startswith('[INFO]')]

          if errors:
              print("[DES] Scenario has errors — aborting.")
              result = {
                  "written_at": int(time.time() * 1000),
                  "status": "error",
                  "sysml_active_nodes": sysml_active_nodes,
                  "des_active_nodes": active_nodes,
                  "errors": errors,
                  "warnings": warnings,
              }
          else:
              print("[DES] Running scenario...")
              try:
                  run_scenario(slider_value_dict)
              except Exception as exc:
                  result = {
                      "written_at": int(time.time() * 1000),
                      "status": "error",
                      "warnings": warnings,
                      "inputs": slider_value_dict,
                      "sysml_active_nodes": sysml_active_nodes,
                      "des_active_nodes": active_nodes,
                      "errors": [str(exc)],
                      "error_type": type(exc).__name__,
                  }
                  print(f"[DES] Scenario failed — results file will still be written: {exc}")
              else:
                  with open('lunar_spaceport_results.json') as f:
                      sim_results = json.load(f)

                  with open('lunar_spaceport_log.json') as f:
                      sim_log = json.load(f)

                  result = {
                      "written_at": int(time.time() * 1000),
                      "status": "success",
                      "warnings": warnings,
                      "inputs": slider_value_dict,
                      "sysml_active_nodes": sysml_active_nodes,
                      "des_active_nodes": active_nodes,
                      "results": sim_results,
                      "log": sim_log,
                  }

          result["scenario_name"] = scenario_name
          result["scenario_slug"] = scenario_slug
          result["request_id"] = request_id
          result["sysml_file"] = str(sysml_file)
          with open('outputs/des_results.json', 'w') as f:
              json.dump(result, f, indent=2)
          with (scenario_output_dir / 'des_results.json').open('w') as f:
              json.dump(result, f, indent=2)

          print(f"[DES] Done — {scenario_output_dir / 'des_results.json'} written")
          EOF

      - name: Run USD Scene Generation (Steps 3, 5, 6)
        env:
          SCENARIO_SLUG: ${{ github.event.inputs.scenario_slug || 'ECLIPSE_Project' }}
          SYSML_FILE: ${{ github.event.inputs.sysml_file || 'clean_database/sysml/ECLIPSE_Project.sysml' }}
          CAD_AXIS_OVERRIDES_JSON: ${{ github.event.inputs.cad_axis_overrides }}
        run: |
          python - <<'EOF'
          import sys, os, json
          from pathlib import Path

          scenario_slug = os.environ.get("SCENARIO_SLUG", "ECLIPSE_Project").strip()
          sysml_path = Path(os.environ.get("SYSML_FILE", "clean_database/sysml/ECLIPSE_Project.sysml"))
          scenario_json_dir = Path("clean_database/json") / scenario_slug
          scenario_output_dir = Path("outputs/scenarios") / scenario_slug
          assets_dir = scenario_json_dir / "assets"
          scenario_json_path = scenario_json_dir / f"{scenario_slug}.json"

          def normalize_axis(value, allowed, fallback):
              axis = str(value or fallback).strip().upper()
              if axis in {"X", "Y", "Z"} and any(item.startswith("+") for item in allowed):
                  axis = f"+{axis}"
              return axis if axis in allowed else fallback

          def apply_cad_axis_overrides():
              raw = os.environ.get("CAD_AXIS_OVERRIDES_JSON", "{}").strip() or "{}"
              try:
                  overrides = json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"[USD] CAD axis overrides ignored: invalid JSON ({exc})")
                  return

              if not isinstance(overrides, dict) or not overrides:
                  print("[USD] No CAD axis overrides provided.")
                  return

              applied = 0
              for module_name, values in overrides.items():
                  if not isinstance(values, dict):
                      continue
                  asset_path = assets_dir / f"{module_name}.json"
                  if not asset_path.exists():
                      print(f"[USD] CAD axis override skipped for {module_name}: asset JSON not found.")
                      continue

                  with asset_path.open() as f:
                      asset = json.load(f)

                  metadata = asset.setdefault("metadata", {})
                  if "cadSourceUpAxis" in values:
                      metadata["cadSourceUpAxis"] = normalize_axis(
                          values.get("cadSourceUpAxis"),
                          {"X", "Y", "Z"},
                          "Z",
                      )
                  if "cadSourceFrontAxis" in values:
                      metadata["cadSourceFrontAxis"] = normalize_axis(
                          values.get("cadSourceFrontAxis"),
                          {"+X", "-X", "+Y", "-Y", "+Z", "-Z"},
                          "+X",
                      )

                  with asset_path.open("w") as f:
                      json.dump(asset, f, indent=2)
                      f.write("\n")

                  applied += 1
                  print(
                      f"[USD] CAD axes for {module_name}: "
                      f"up={metadata.get('cadSourceUpAxis')}, "
                      f"front={metadata.get('cadSourceFrontAxis')}"
                  )

              print(f"[USD] Applied CAD axis override(s): {applied}")

          apply_cad_axis_overrides()

          # ── Update authoritative SysML CAD metadata ───────────────────────
          try:
              from S24.sysml.cad_metadata_updater import update_cad_metadata_from_previews

              updated_cad_metadata = update_cad_metadata_from_previews(
                  sysml_path=sysml_path,
                  assets_dir=assets_dir,
                  previews_dir=Path("outputs/cad_previews"),
                  repo_root=Path(".").resolve(),
              )
              print(f"[CAD] SysML CAD metadata update complete: {updated_cad_metadata} part(s)")
          except Exception as e:
              print(f"[CAD] SysML CAD metadata update failed: {e}")

          # ── Step 3: Build submission manifest ─────────────────────────────
          try:
              from S24.usd.model_submission import build_submission_manifest

              all_asset_paths = sorted(
                  assets_dir.glob("*.json"),
                  key=lambda p: p.name.lower(),
              )
              eclipse_path = scenario_json_path
              active_part_names = set()
              if eclipse_path.exists():
                  with eclipse_path.open() as f:
                      eclipse = json.load(f)
                  active_part_names = {
                      part.get("name")
                      for part in eclipse.get("parts", [])
                      if part.get("name")
                  }

              asset_paths = [
                  path for path in all_asset_paths
                  if not active_part_names or path.stem in active_part_names
              ]
              skipped_assets = [
                  path.stem for path in all_asset_paths
                  if path not in asset_paths
              ]
              if skipped_assets:
                  print(
                      "[USD] Skipped inactive asset JSON(s): "
                      + ", ".join(skipped_assets)
                  )

              if not asset_paths:
                  print("[USD] No asset JSON files found — skipping USD generation.")
                  sys.exit(0)

              print(f"[USD] Building manifest from {len(asset_paths)} asset(s)...")
              model_manifest = build_submission_manifest(asset_paths=asset_paths, verbose=1)
              print(f"[USD] Manifest built — {len(model_manifest)} part(s)")
          except Exception as e:
              print(f"[USD] Step 3 failed: {e}")
              sys.exit(0)

          # ── Inject positions/rotations from ECLIPSE_Project.json ──────────
          try:
              eclipse_path = scenario_json_path
              if eclipse_path.exists():
                  with eclipse_path.open() as f:
                      eclipse = json.load(f)
                  # Build lookup: part name → transform
                  transforms = {}
                  for part in eclipse.get("parts", []):
                      name = part.get("name")
                      transform = part.get("transform", {})
                      if name and transform:
                          transforms[name] = transform
                  # Inject into manifest
                  injected = 0
                  for part in model_manifest.get("parts", []):
                      name = part.get("name")
                      if name in transforms:
                          part["position_m"] = transforms[name].get("position_m", [0, 0, 0])
                          part["rotation_deg"] = transforms[name].get("rotation_deg", [0, 0, 0])
                          if "scale" in transforms[name]:
                              part["scale"] = transforms[name]["scale"]
                          injected += 1
              print(f"[USD] Injected positions for {injected} part(s) from {scenario_json_path.name}")
          except Exception as e:
              print(f"[USD] Position injection failed: {e}")

          # ── Step 5: Build USD scene ────────────────────────────────────────
          try:
              from S24.usd import build_usd_scene_from_manifest

              scene_dir = scenario_output_dir / "omniverse"
              scene_dir.mkdir(parents=True, exist_ok=True)
              scene_path = str(scene_dir / "scene.usda")

              usd_scene_path = build_usd_scene_from_manifest(
                  manifest=model_manifest,
                  output_path=scene_path,
                  verbose=1
              )
              print(f"[USD] Scene written → {usd_scene_path}")
          except Exception as e:
              print(f"[USD] Step 5 failed: {e}")

          # ── Step 6: Build waypoints USD ────────────────────────────────────
          try:
              from S24.usd.waypoints import write_connections_usda

              waypoints_dir = scenario_output_dir / "omniverse"
              waypoints_dir.mkdir(parents=True, exist_ok=True)

              json_path = str(scenario_json_path)
              waypoints_path = str(waypoints_dir / "waypoints.usda")

              connections_usda = write_connections_usda(
                  json_path=json_path,
                  output_usda_path=waypoints_path,
                  curve_width=4.0,
                  write_waypoints=True,
                  marker_radius=10.0,
                  verbose=1,
              )
              print(f"[USD] Waypoints written → {waypoints_path}")
          except Exception as e:
              print(f"[USD] Step 6 failed: {e}")
          EOF
          echo "[OMNI] Building visualization manifest..."
          python extensions/lsp1.pipeline/build_omniverse_manifest.py
          echo "[OMNI] Manifest build complete."

      - name: Commit results
        env:
          SCENARIO_SLUG: ${{ github.event.inputs.scenario_slug || 'ECLIPSE_Project' }}
          SYSML_FILE: ${{ github.event.inputs.sysml_file || 'clean_database/sysml/ECLIPSE_Project.sysml' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          STASHED=$(git stash --include-untracked 2>&1)
          git pull --rebase origin "${GITHUB_REF_NAME}"
          echo "$STASHED" | grep -q "No local changes" || git stash pop
          git add outputs/des_results.json
          git add "outputs/scenarios/${SCENARIO_SLUG}/des_results.json"
          git add "${SYSML_FILE}" || true
          git add "clean_database/json/${SCENARIO_SLUG}/${SCENARIO_SLUG}.json"
          git add "clean_database/json/${SCENARIO_SLUG}/assets/"*.json || true
          git add "outputs/scenarios/${SCENARIO_SLUG}/omniverse/" || true
          echo "=== staged files ==="
          git diff --staged --name-only
          git diff --staged --quiet || git commit -m "chore: DES results + SysML + Omniverse scene update [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
